<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<h1>EXERCICE 1</h1>
<body>
    <script type="text/javascript">
        //majeure ou mineur
        let age = prompt("Votre age :");
        let message = (age >= 18) ? "vous êtes majeur." : "Vous êtes mineur.";
        console.log(message);

        // pair ou impair
        let nombre = prompt("Entrer un nombre entier :");
        let message2 = (nombre%2 === 0)? `${nombre} est pair.` : `${nombre} est impair.`;
        console.log(message2);

        // Mois de l'année
        let mois = prompt("Enter le chiffre correspondant au mois actuel(1 - 12) :");
        switch (mois){
            case "1" :
                console.log("Janvier");
                break;
            case "2" :
                console.log("Février");
                break;
            case "3" :
                console.log("Mars");
                break;
            case "4" :
                console.log("Avril");
                break;
            case "5" :
                console.log("Mai");
                break;
            case "6" :
                console.log("Juin");
                break;
            case "7" :
                console.log("Juillet");
                break;
            case "8" :
                console.log("Août");
                break;
            case "9" :
                console.log("Septembre");
                break;
            case "10" :
                console.log("Octobre");
                break;
            case "11":
                console.log("Novembre");
                break;
            case "12" :
                console.log("Décembre");
                break;
            default :
                console.log("Saisie invalide.")
        }
    </script>
</body>
</html>
